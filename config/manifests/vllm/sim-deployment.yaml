apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen3-32b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-qwen3-32b
  template:
    metadata:
      labels:
        app: vllm-qwen3-32b
        inference.networking.k8s.io/engine-type: vllm
    spec:
      volumes:
      - name: sim-data
        emptyDir: {}
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.0
        imagePullPolicy: Always
        volumeMounts:
        - name: sim-data
          mountPath: /tmp/sim-data
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        args:
        - --model
        - Qwen/Qwen3-32B
        - --port
        - "8000"
        - --served-model-name
        - premium
        - standard
        - batch
        - --dataset-path
        - "/tmp/sim-data/conversations.sqlite3"
        - --dataset-url
        - "https://huggingface.co/datasets/hf07397/inference-sim-datasets/resolve/main/huggingface/ShareGPT_Vicuna_unfiltered/conversations.sqlite3"
        - --max-model-len
        - "8192"
        - --prefill-overhead
        - "50ms"
        - --prefill-time-per-token
        - "2ms"
        - --prefill-time-std-dev
        - "0.5ms"
        - --inter-token-latency
        - "20ms"
        - --inter-token-latency-std-dev
        - "5ms"
        - --time-factor-under-load
        - "1.5"
        - --max-num-seqs
        - "10"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 100m
